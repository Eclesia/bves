<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 440" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bannière : la baie, le bocage, un phare et des habitants main dans la main">
<style>
.blob,.ring,.spin{transform-box:fill-box;transform-origin:center}
.blob{animation:float 9s ease-in-out infinite alternate}
.ring{animation:breathe 7s ease-in-out infinite alternate}
.spin{animation:spin 90s linear infinite}
.cloud{animation:drift 40s ease-in-out infinite alternate}
.w1{animation:wave 9s linear infinite}.w2{animation:wave 13s linear infinite reverse}.w3{animation:wave 18s linear infinite}
.bird{animation:fly 22s ease-in-out infinite alternate}
.p{animation:bob 2.6s ease-in-out infinite;animation-delay:var(--d)}
.b1,.b2{animation:beam 8s ease-in-out infinite}.b2{animation-delay:-4s}
.lamp{animation:glow 4s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(-10px,8px) rotate(-3deg)}}
@keyframes breathe{to{transform:scale(1.04)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{to{transform:translateX(80px)}}
@keyframes wave{to{transform:translateX(-240px)}}
@keyframes fly{to{transform:translate(140px,-24px)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes beam{0%{opacity:0}25%{opacity:.38}50%,100%{opacity:0}}
@keyframes glow{from{opacity:.7}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c7a46"/><stop offset=".6" stop-color="#288d51"/><stop offset="1" stop-color="#3aa563"/></linearGradient></defs>
<rect width="1440" height="440" fill="url(#sky)"/>
