<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="icon" href="{{ "img/logo.jpg" | relURL }}">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
{{ $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
<a class="skip" href="#contenu">Aller au contenu</a>
{{ partial "header.html" . }}
<main id="contenu">{{ block "main" . }}{{ end }}</main>
{{ partial "footer.html" . }}
{{ $js := resources.Get "js/theme.js" | minify }}<script>{{ $js.Content | safeJS }}</script>
<script>
(function(){var t=new Date().toISOString().slice(0,10);document.querySelectorAll('.event[data-date]').forEach(function(e){if(e.dataset.date<t)e.classList.add('past')})})();
</script>
</body>
</html>
