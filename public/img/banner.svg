  <circle class="ring" r="96" fill="none" stroke="#f6e8a0" stroke-width="14"/>
  <circle class="spin" r="124" fill="none" stroke="#f6e8a0" stroke-width="3" stroke-dasharray="4 12" opacity=".55"/>
</g>
<g fill="#fff" opacity=".18"><g class="cloud"><ellipse cx="820" cy="95" rx="70" ry="16"/><ellipse cx="865" cy="84" rx="45" ry="14"/></g><g class="cloud" style="animation-duration:55s"><ellipse cx="1240" cy="55" rx="80" ry="15"/><ellipse cx="1195" cy="66" rx="50" ry="12"/></g></g>
