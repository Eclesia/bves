{{ define "main" }}
<section class="page"><div class="wrap">
  {{ partial "breadcrumb.html" . }}
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  <div class="cards">{{ range .Pages.ByDate.Reverse }}{{ partial "card.html" . }}{{ end }}</div>
</div></section>
{{ end }}
