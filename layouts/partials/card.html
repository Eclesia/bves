<article class="card">{{ with .Resources.GetMatch "cover*" }}{{ $t := .Fill "480x250 q80" }}<a href="{{ $.RelPermalink }}" tabindex="-1" aria-hidden="true"><img class="thumb" src="{{ $t.RelPermalink }}" alt="" width="{{ $t.Width }}" height="{{ $t.Height }}" loading="lazy"></a>{{ end }}<h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description }}</p></article>
