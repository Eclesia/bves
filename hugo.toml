baseURL = "https://www.example.org/"
title = "Baie Vivante et Solidaire"
locale = "fr"
defaultContentLanguage = "fr"
buildFuture = true            # les événements à venir sont publiés
disableKinds = ["RSS", "taxonomy"]

[frontmatter]
  date = [":filename", ":default"]   # 2026-11-22-nom/ => date de l’événement

[taxonomies]
  category = "categories"

[params]
  tagline = "Association du Cotentin"
  description = "Association solidaire du Cotentin : alimentation, culture, environnement et débat citoyen."
  facebook = "https://www.facebook.com/BaieVivanteSolidaire/"

[[menus.main]]
  name = "Actions"
  pageRef = "/actions"
  weight = 10
[[menus.main]]
  name = "Événements"
  pageRef = "/evenements"
  weight = 20
[[menus.main]]
  name = "L’association"
  pageRef = "/association"
  weight = 30

[caches]
  [caches.images]
    dir = ':cacheDir/images'