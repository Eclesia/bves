{{ $cur := . }}
<header class="top"><div class="wrap">
<nav aria-label="Navigation principale">
  <a class="brand" href="{{ "./" | relURL }}"><img src="{{ "img/logo.jpg" | relURL }}" alt="" width="52" height="52"><span>{{ site.Title }}<small>{{ site.Params.tagline }}</small></span></a>
  <ul class="menu">
  {{ range site.Menus.main }}
    <li{{ if .HasChildren }} class="has-sub"{{ end }}>
      <a href="{{ .URL }}"{{ if or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ if .HasChildren }}<ul class="sub">{{ range .Children }}<li><a href="{{ .URL }}">{{ .Name }}</a></li>{{ end }}</ul>{{ end }}
    </li>
  {{ end }}
  </ul>
  <button class="theme-toggle" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Mode sombre"><span class="knob"></span></button>
</nav>
</div></header>
